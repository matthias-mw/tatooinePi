#===============================================
# Simu-System: eigene Konfiguration für die Weiterentwicklung
# Aufruf: tatooine_monitor.py -c /opt/tatooinePi/tatooine_monitor/monitor_simu.conf
#===============================================

#===============================================
# Einstellungen für die InfluxDB (V2 API)
#===============================================
[InfluxDB]
# IP Adresse der InfluxDB
HOST: 127.0.0.1
# Port der InfluxDB
PORT: 8086
# InfluxDB V2 API Token (muss in InfluxDB erstellt werden)
TOKEN: LNL9j8x4f43BnnYUDPnBRlUnLngqYLFJgIv6PfX0t2wa1UeN1zpXLEtLKFZiQy3bofdQz3ZNNMaZN_SQ_GnqOA==
# InfluxDB V2 Organisation
ORG: sv-tatooine
# InfluxDB V2 Bucket (muss bereits vorhanden sein)
# Eigenes Bucket für das Simu-System, damit sich die Daten nicht mit dem Live-System vermischen
BUCKET: sensors_simu
# Location Tag der den Messdaten mitgegeben wird
TAG_LOCATION: tatooine-simu
# Name des Measurements in der InfluxDB
MEASUREMENT: TatooineRemote
# Developer Mode: true = speichert zusatzliche Debug-Felder (_raw, _dev_abs, _dev_perc, _value_mean)
#                  false = speichert nur den Hauptmesswert (spart Speicherplatz in InfluxDB)
DEVELOPER_MODE: true


#===============================================
# Einstellungen für das Logging
#===============================================
[Logging]
# Logging file
LOG_FILE: monitor_simu.log
# Logging Pfad
LOG_DIR: /opt/tatooinePi/tatooine_monitor
# Logging Level (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL: INFO


#===============================================
# Einstellungen für die Benachrichtigungen
#===============================================
[ALERTING]
# Ausgangsseerver für den EMail Versand
SMTP_SERVER: smtp.strato.de
SMTP_PORT: 587

# Absenderadresse für die AlarmEMails
EMAIL_SENDER: info@sv-tatooine.com
# Empfänger für die AlarmEMails
EMAIL_RECIEVER: werner.matthias@web.de
# Anzahl von Sekunden, die eine AlarmEMail zwischen dem Eintritt des Alamms
# und dem Versenden verzögert wird
DEBOUNCE_EMAIL_ALARM_S: 5
# Anzahl von Sekunden, die zwischen dem Versand von 2 AlarmEMails vergehen muss
DEBOUNCE_EMAIL_BETWEEN_ALARM_S: 120
# Maximale Anzahl von EMails, die an einem Tag versendet werden dürfen
EMAIL_LIMIT_PER_DAY: 3


#===============================================
# Einstellungen für Allgemeines
#===============================================
[COMMON]
# Verzeichnis für die Ermittelung der Datenbankgröße der InfluxDB
INFLUX_DB_PATH: /var/lib/influxdb/.influxdbv2/engine/data
# Verzeichnis für die Ermittelung der Datenbankgröße der Videos
VIDEO_PATH: /home/tatooine/motioneye/video
